version: 2
updates:
  # The pinned GitHub Actions (every `uses:` is a commit SHA with its version
  # in a comment; Dependabot updates both).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  # The two hash-pinned Python tools, each compiled from its requirements.in
  # with pip-compile: zizmor (.github/zizmor) and typos (.github/docs-checks).
  # They are the only other dependencies: make-sboms.sh pins its generators
  # by version and SHA-256 by hand, and Dependabot has no ecosystem for them.
  - package-ecosystem: "pip"
    directories:
      - "/.github/zizmor"
      - "/.github/docs-checks"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      python-tools:
        patterns:
          - "*"
