version: 2
updates:
  # The pinned GitHub Actions (every `uses:` is a commit SHA with its version
  # in a comment; Dependabot updates both).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  # zizmor, hash-pinned in .github/zizmor/requirements.txt
  - package-ecosystem: "pip"
    directory: "/.github/zizmor"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    cooldown:
      default-days: 7

  # typos, hash-pinned in .github/docs-checks/requirements.txt
  - package-ecosystem: "pip"
    directory: "/.github/docs-checks"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    cooldown:
      default-days: 7
