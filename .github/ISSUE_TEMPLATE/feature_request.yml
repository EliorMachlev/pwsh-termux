name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and why the current packages don't allow it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Note that PowerShell itself is Microsoft's: changes to its behavior belong in the PowerShell repository.
    validations:
      required: false
