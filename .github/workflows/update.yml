name: Update packages

on:
  schedule:
    - cron: "23 4 * * *"      # daily; Microsoft releases roughly monthly
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/update.yml"]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # create archive releases for each built .deb
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y patchelf jq gnupg xz-utils

      - name: Find upstream releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/find-releases.sh | tee releases.txt

      - name: Build packages
        run: |
          mkdir -p debs
          while read -r channel tag; do
            case "$channel" in
              stable)  pkg=pwsh ;;
              preview) pkg=pwsh-preview ;;
              *) echo "unknown channel $channel" >&2; exit 1 ;;
            esac
            bash scripts/build-deb.sh "$pkg" "$tag" debs
          done < releases.txt

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY secret is not set; refusing to publish an unsigned repository"
            exit 1
          fi
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          echo "SIGN_KEY=$fpr" >> "$GITHUB_ENV"

      - name: Build signed apt repository
        run: bash scripts/build-repo.sh debs repo

      - name: Archive each .deb as a release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for deb in debs/*.deb; do
            name=$(dpkg-deb -f "$deb" Package)
            ver=$(dpkg-deb -f "$deb" Version)
            tag="${name}-${ver//\~/-}"          # git tags cannot contain '~'
            if gh release view "$tag" >/dev/null 2>&1; then continue; fi
            flags=()
            [ "$name" = pwsh-preview ] && flags+=(--prerelease)
            gh release create "$tag" "$deb" "${flags[@]}" \
              --title "$name $ver" \
              --notes "Unofficial Termux repackaging of Microsoft PowerShell. Install via the apt repository, see the README."
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: repo

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
