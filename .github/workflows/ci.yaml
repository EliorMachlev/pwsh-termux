name: CI

# The packaging scripts and the workflows, checked on every change:
#   shellcheck  every script under scripts/, and the shared library
#               scripts/lib/common.sh they source (.shellcheckrc follows it)
#   jactionlint every workflow and the Dependabot configuration (syntax,
#               expressions, ShellCheck on run: steps, and every rule of its
#               pedantic profile; a finding of any level fails)
#   keys        keys/ follows the key rules (one online key, plus the keys
#               keys/RECOVERY and keys/ROTATION name), SECURITY.md lists them,
#               and scripts/test-keys.sh tests the rules, the publish checks,
#               the recovery scripts and the index's Valid-Until window;
#               scripts/test-release-tags.sh tests the signed release tags
#   keepalive   scripts/test-keepalive.sh: the schedule keep-alive
#               (keep-schedules-alive.sh) against a stub gh, offline
#   keepalive-commit  scripts/test-keepalive-commit.sh: the keep-alive
#               commit (keepalive-commit.sh) and the audit of main
#               (audit-main-commits.sh), with local git repositories and a
#               stub gh, offline
#   packaging-tests  scripts/test-find-releases.sh, test-build-deb.sh,
#               test-make-sboms.sh, test-fetch-verified.sh and
#               test-assemble-site.sh: the release lookup, the .deb build, the
#               SBOMs, the verified download and the site assembly, with
#               stub downloads, fake tarballs and local git repositories,
#               offline
#   device-smoke  the real .deb built and run on an arm64 runner, with the
#               Termux glibc paths faked, so the patched loader and rpath are
#               exercised (build.md, "Testing on a device")
#   coverage    every scripts/test-*.sh traced, and the Hypothesis tests under
#               coverage.py: the share of scripts/ the tests run
#               (.github/scripts/coverage.py), failing below a floor
#   package     a real build of the current stable PowerShell (twice, compared
#               byte for byte) and of the keyring package (reproducible,
#               from keys/) into an apt
#               repository, unsigned and signed with a throwaway key, then
#               the website checks and assembly
on:
  # Every pull request, whatever it changes: its jobs are required status
  # checks on main (ci-cd/rulesets.md), and a workflow a path filter
  # skips never reports, which would leave the pull request unmergeable.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'keys/**'
      - 'packaging-revisions'
      - 'SECURITY.md'
      - 'docs/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '.shellcheckrc'
      - '.github/dependabot.yml'
      - 'tests/**'
      - 'tools/coverage/**'
      - 'tools/fuzz/**'
      - 'tools/site-lint/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/main"]'), github.ref) }}

permissions:
  contents: read

env:
  # jactionlint's release binary (jdx's maintained fork of actionlint,
  # https://github.com/jdx/jactionlint), checked against this SHA-256 before
  # it runs (it matched the release's own checksums file when it was pinned).
  # Dependabot doesn't follow a download: for a new release, update both
  # lines by hand, after checking that file (ci-cd/dependabot.md).
  JACTIONLINT_VERSION: "2.4.0"
  JACTIONLINT_SHA256: "26ddba81db28fffc51163175c070ee1a9d1150260de4b5232f01d9b749f32d8e"
  # shfmt's release binary (https://github.com/mvdan/sh), whose parser gives
  # the coverage job the commands of each script; checked the same way (it
  # matched the release asset's digest when it was pinned), updated by hand.
  SHFMT_VERSION: "3.14.1"
  SHFMT_SHA256: "76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf"

# Every run: step runs as `bash --noprofile --norc -eo pipefail {0}`: a
# failure anywhere in a pipeline fails the step.
defaults:
  run:
    shell: bash

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.actions.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck --shell=bash --severity=style scripts/*.sh scripts/lib/*.sh

  jactionlint:
    name: jactionlint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.actions.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install jactionlint
        run: |
          archive="$RUNNER_TEMP/jactionlint.tar.gz"
          bash scripts/fetch-verified.sh "https://github.com/jdx/jactionlint/releases/download/v${JACTIONLINT_VERSION}/jactionlint_${JACTIONLINT_VERSION}_linux_amd64.tar.gz" "$JACTIONLINT_SHA256" "$archive"
          tar -xzf "$archive" -C "$RUNNER_TEMP" jactionlint
      # ShellCheck comes with the runner image. The pedantic profile is every
      # rule of the default and correctness profiles plus the opinionated ones,
      # named here so no config file can change it unseen; --strict-exit fails
      # the job on a finding of any level (info and warning as well as error);
      # --no-ignores: no ignore comment, config-file ignore or baseline hides a
      # finding; --config-file=/dev/null: no config file turns a rule off or
      # lowers its level. Nothing can be silenced without editing this line.
      - name: jactionlint
        run: '"$RUNNER_TEMP/jactionlint" --profile pedantic --strict-exit --no-ignores --config-file=/dev/null --format github'

  keys:
    name: Key rules and key tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.actions.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The key rules, with the fingerprints
        run: bash scripts/check-keys.sh | tee fingerprints.txt
      - name: SECURITY.md lists the keys in keys/
        run: |
          fpr=$(awk -F'|' '$2 ~ /Fingerprint/ {gsub(/[` ]/, "", $3); print $3; exit}' SECURITY.md)
          test -n "$fpr"
          echo "SECURITY.md: $fpr"
          awk '$2 == "current" || $2 == "next" {print $1}' fingerprints.txt | grep -qx "$fpr"
          recovery=$(awk '$2 == "recovery" {print $1}' fingerprints.txt)
          if [ -n "$recovery" ]; then
            grep -q "$recovery" <<<"$(tr -d ' ' < SECURITY.md)"
          fi
      # Throwaway keys and a stub gh: every allowed key shape and the refused
      # ones, the signer rules (never the recovery key), altered, unverified
      # and unattested keyring packages, recovery signing, and the index's
      # Valid-Until window (a re-sign changes InRelease, not Packages).
      - name: Test the key rules and the publish checks
        run: bash scripts/test-keys.sh
      # Throwaway keys and a local bare remote, offline: release tags signed
      # by the online key and checked with gpgv and `git tag -v`; tags
      # signed by any other key, unsigned, lightweight or altered refused;
      # the push, and its deferral when main's workflows changed.
      - name: Test the signed release tags
        run: bash scripts/test-release-tags.sh
      # Offline, throwaway keys: the hand-off between the unsigned job and the
      # signing job (bundle, sign, install, tag payloads); anything altered,
      # stale, linked or signed by another key is refused.
      - name: Test the split signing
        run: bash scripts/test-sign-release.sh

  # A stub gh, offline: which workflows count as scheduled, what refresh
  # enables and leaves alone (never one turned off by hand), when refresh and
  # check fail, and that --dry-run writes nothing.
  keepalive:
    name: Schedule keep-alive tests
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.actions.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the schedule keep-alive
        run: bash scripts/test-keepalive.sh

  # Local git repositories with a bare remote, a stub gh, offline, no key:
  # the keep-alive commit (pushed, skipped, dry run, retried, refused) and
  # its guard; the audit of main and its issue.
  keepalive-commit:
    name: Keep-alive commit and audit tests
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.actions.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the keep-alive commit and the audit of main
        run: bash scripts/test-keepalive-commit.sh

  # Stubs and fixtures, offline: a stub curl answering with a releases list,
  # fake upstream tarballs (ELF headers, checksums files in each encoding),
  # stub SBOM tools, local git repositories. What each script accepts,
  # writes and refuses (each refusal checked for its reason).
  packaging-tests:
    name: Packaging script tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.actions.githubusercontent.com:443
            *.archive.ubuntu.com:80
            *.archive.ubuntu.com:443
            security.ubuntu.com:80
            security.ubuntu.com:443
            ports.ubuntu.com:80
            ports.ubuntu.com:443
            packages.microsoft.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y patchelf jq xz-utils
      - name: Test find-releases.sh
        run: bash scripts/test-find-releases.sh
      - name: Test build-deb.sh
        run: bash scripts/test-build-deb.sh
      - name: Test make-sboms.sh
        run: bash scripts/test-make-sboms.sh
      - name: Test fetch-verified.sh
        run: bash scripts/test-fetch-verified.sh
      - name: Test assemble-site.sh
        run: bash scripts/test-assemble-site.sh

  # Statement coverage of scripts/: every test script run again with each
  # Bash process traced (xtrace through BASH_ENV, into files under
  # RUNNER_TEMP), then each line that starts a command (from shfmt's parser)
  # counted as run or not; the Python under coverage.py while the Hypothesis
  # tests run. Fails when a total drops below its floor. The traces hold
  # every command's arguments: only tests run here (throwaway keys, stubs, no
  # secret), and the traces are never uploaded. The floors are the measured
  # coverage rounded down: raise them when tests are added, never lower them
  # to let a change through.
  coverage:
    name: Coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      VNU_JAR: tools/site-lint/node_modules/vnu-jar/build/dist/vnu.jar
      # Measured here: Bash 97.3%, Python 94.2%, total 96.9%. Hypothesis
      # draws new inputs each run, so the Python figure moves a little (93.4%
      # in another run): its floor is the lowest seen, rounded down.
      COVERAGE_MIN_BASH: "97"
      COVERAGE_MIN_PYTHON: "93"
      COVERAGE_MIN_TOTAL: "96"
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            release-assets.githubusercontent.com:443
            *.archive.ubuntu.com:80
            *.archive.ubuntu.com:443
            security.ubuntu.com:80
            security.ubuntu.com:443
            ports.ubuntu.com:80
            ports.ubuntu.com:443
            packages.microsoft.com:443
            pypi.org:443
            files.pythonhosted.org:443
            registry.npmjs.org:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Hypothesis and coverage.py pinned by hash (tools/fuzz and
      # tools/coverage, compiled on this Python version); Dependabot updates
      # them.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install Hypothesis and coverage.py
        run: python -m pip install --quiet --require-hashes -r tools/fuzz/requirements.txt -r tools/coverage/requirements.txt
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y patchelf jq xz-utils
      - name: Install shfmt
        run: |
          bash scripts/fetch-verified.sh "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" "$SHFMT_SHA256" "$RUNNER_TEMP/shfmt"
          chmod 755 "$RUNNER_TEMP/shfmt"
      # As in site.yaml: the lockfile's versions, no install script.
      - name: Install vnu
        working-directory: tools/site-lint
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit signatures
      - name: Run the tests, traced
        run: |
          for test in scripts/test-*.sh; do
            echo "::group::$test"
            args=()
            if [ "$test" = scripts/test-validate-site.sh ]; then args=("$VNU_JAR"); fi
            python .github/scripts/coverage.py run "$RUNNER_TEMP/trace" -- bash "$test" "${args[@]}"
            echo "::endgroup::"
          done
      - name: Run the Hypothesis tests under coverage.py
        env:
          HYPOTHESIS_PROFILE: ci
          COVERAGE_FILE: ${{ runner.temp }}/python.coverage
        run: |
          python -m coverage run --include='scripts/*.py' -m unittest discover -s tests/fuzz
          python -m coverage json -o "$RUNNER_TEMP/python-coverage.json"
      - name: Report, and check the floors
        run: |
          python .github/scripts/coverage.py report "$RUNNER_TEMP/trace" \
            --shfmt "$RUNNER_TEMP/shfmt" --python-json "$RUNNER_TEMP/python-coverage.json" \
            --fail-under-bash "$COVERAGE_MIN_BASH" --fail-under-python "$COVERAGE_MIN_PYTHON" \
            --fail-under-total "$COVERAGE_MIN_TOTAL"

  # CI's x86 runners cannot run the arm64 binary; this arm64 one can. The
  # package's patched interpreter and rpath point into Termux's prefix, so
  # the runner gets those paths as symlinks to its own glibc. It does not
  # replace a run on a phone (Termux's own glibc and libraries), but it fails
  # when the patch or the package layout is wrong. ICU is switched off (the
  # runner has no Termux libicu), so only startup and a command run.
  device-smoke:
    name: Run the package (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      TERMUX_PREFIX: /data/data/com.termux/files/usr
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            release-assets.githubusercontent.com:443
            *.archive.ubuntu.com:80
            *.archive.ubuntu.com:443
            security.ubuntu.com:80
            security.ubuntu.com:443
            ports.ubuntu.com:80
            ports.ubuntu.com:443
            packages.microsoft.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y patchelf jq xz-utils
      - name: Build the .deb
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/find-releases.sh | tee releases.txt
          tag=$(awk '$1 == "stable" {print $2}' releases.txt)
          mkdir -p debs
          bash scripts/build-deb.sh pwsh "$tag" debs
      - name: Fake Termux's glibc paths and install the package
        run: |
          lib="$TERMUX_PREFIX/glibc/lib"
          sudo mkdir -p "$lib"
          for f in /lib/aarch64-linux-gnu/*.so*; do sudo ln -sf "$(readlink -f "$f")" "$lib/$(basename "$f")"; done
          sudo ln -sf "$(readlink -f /lib/ld-linux-aarch64.so.1)" "$lib/ld-linux-aarch64.so.1"
          sudo dpkg-deb -x debs/pwsh_*_aarch64.deb /
      - name: Run pwsh
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
        run: |
          "$TERMUX_PREFIX/opt/pwsh/pwsh" -NoProfile -Command "\$PSVersionTable.PSVersion.ToString()"
          test "$("$TERMUX_PREFIX/bin/pwsh" -NoProfile -Command '1 + 1')" = 2

  package:
    name: Package build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            release-assets.githubusercontent.com:443
            *.archive.ubuntu.com:80
            *.archive.ubuntu.com:443
            security.ubuntu.com:80
            security.ubuntu.com:443
            ports.ubuntu.com:80
            ports.ubuntu.com:443
            packages.microsoft.com:443
            spdx.org:443
            toolbox-data.anchore.io:443
            repo1.maven.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0       # assemble-site.sh reads each document's last commit (git log)
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y patchelf jq xz-utils
      - name: Check the website
        run: python3 .github/scripts/site-check.py docs
      - name: Find the current stable release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/find-releases.sh | tee releases.txt
      - name: Build the .deb
        run: |
          tag=$(awk '$1 == "stable" {print $2}' releases.txt)
          mkdir -p debs
          bash scripts/build-deb.sh pwsh "$tag" debs
      # The daily update.yaml run rebuilds an unchanged release; it must give
      # the same bytes, or Packages would change every day.
      - name: Build the .deb again and compare (reproducible)
        run: |
          tag=$(awk '$1 == "stable" {print $2}' releases.txt)
          sleep 2
          bash scripts/build-deb.sh pwsh "$tag" debs-again
          cmp debs/pwsh_*.deb debs-again/pwsh_*.deb
      - name: Build the keyring package twice and compare
        run: |
          bash scripts/build-keyring.sh debs
          bash scripts/build-keyring.sh keyring-again
          cmp debs/pwsh-termux-keyring_*_all.deb keyring-again/pwsh-termux-keyring_*_all.deb
      - name: Check the keyring package
        run: |
          deb=$(ls debs/pwsh-termux-keyring_*_all.deb)
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb"
          test "$(dpkg-deb -f "$deb" Architecture)" = all
          # it ships keys/ byte for byte, and a source line scoped to it
          dpkg-deb --fsys-tarfile "$deb" \
            | tar -xOf - ./data/data/com.termux/files/usr/share/keyrings/pwsh-termux-archive-keyring.gpg \
            | cmp - keys/pwsh-termux-archive-keyring.gpg
          dpkg-deb --fsys-tarfile "$deb" \
            | tar -xOf - ./data/data/com.termux/files/usr/etc/apt/sources.list.d/pwsh-termux.list \
            | grep -x 'deb \[signed-by=/data/data/com.termux/files/usr/share/keyrings/pwsh-termux-archive-keyring.gpg\] https://pwsh-termux.machlev.org stable main'
          if dpkg-deb -c "$deb" | grep trusted.gpg.d; then exit 1; fi
      - name: Check the .deb
        run: |
          deb=$(ls debs/pwsh_*.deb)
          dpkg-deb -I "$deb"
          # the binary must name Termux's loader, never the host's
          tmp=$(mktemp -d)
          dpkg-deb -x "$deb" "$tmp"
          interp=$(patchelf --print-interpreter "$tmp"/data/data/com.termux/files/usr/opt/pwsh/pwsh)
          test "$interp" = /data/data/com.termux/files/usr/glibc/lib/ld-linux-aarch64.so.1
          test -L "$tmp/data/data/com.termux/files/usr/bin/pwsh"
      - name: Write the SBOMs (CycloneDX and three SPDX files)
        run: |
          bash scripts/make-sboms.sh debs sboms
          for ext in cdx.json build.spdx.json syft.spdx3.json msft.spdx3.json; do
            ls sboms/pwsh_*."$ext" sboms/pwsh-termux-keyring_*."$ext" > /dev/null
          done
      - name: Build the (unsigned) apt repository and assemble the site
        run: |
          bash scripts/build-repo.sh debs repo
          bash scripts/assemble-site.sh docs repo
          python3 .github/scripts/site-check.py repo
          grep -q 'Now serving <code>pwsh</code>' repo/index.html repo/install.html
          grep -q 'Last updated <time' repo/documents.html repo/privacy.html
          grep -q '^Package: pwsh$' repo/dists/stable/main/binary-aarch64/Packages
          grep -q '^Package: pwsh-termux-keyring$' repo/dists/stable/main/binary-aarch64/Packages
          cmp repo/pwsh-termux-keyring.deb debs/pwsh-termux-keyring_*_all.deb
          cmp repo/pwsh-termux.gpg keys/pwsh-termux-archive-keyring.gpg
          test -f repo/index.html
          test ! -e repo/markDown
      # A real signed repository with the real package (build-repo.sh, then
      # sign-release.sh sign and install), through the test-only
      # KEYRING_FILE (the refusals are in the keys job's test-keys.sh).
      - name: Sign with a throwaway key
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          gpg --batch --passphrase '' --quick-generate-key "ci <ci@example.invalid>" ed25519 sign never
          SIGN_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ && !found {print $10; found = 1}')
          export SIGN_KEY
          mkdir test-keys test-debs
          KEYRING_FILE="$PWD/test-keys/pwsh-termux-archive-keyring.gpg"
          export KEYRING_FILE
          gpg --batch --export "$SIGN_KEY" > "$KEYRING_FILE"
          cp debs/pwsh_*.deb test-debs/
          bash scripts/build-keyring.sh test-debs
          KEYRING_DEB_SHA256=$(sha256sum < test-debs/pwsh-termux-keyring_*_all.deb | cut -d' ' -f1)
          export KEYRING_DEB_SHA256
          VERIFIED_DEB_SHA256S=$(sha256sum test-debs/*.deb | cut -d' ' -f1)
          export VERIFIED_DEB_SHA256S
          bash scripts/build-repo.sh test-debs repo-signed
          dist=repo-signed/dists/stable
          mkdir signing-in
          cp "$dist/Release" "$dist/main/binary-aarch64/Packages" signing-in/
          bash scripts/sign-release.sh sign signing-in signing-out
          bash scripts/sign-release.sh install signing-out repo-signed
          cmp repo-signed/pwsh-termux-keyring.deb test-debs/pwsh-termux-keyring_*_all.deb
          gpgv --keyring "$KEYRING_FILE" repo-signed/dists/stable/InRelease
          grep -q '^Package: pwsh-termux-keyring$' repo-signed/dists/stable/main/binary-aarch64/Packages
