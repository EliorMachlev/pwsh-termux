name: Update packages

# Follows Microsoft's PowerShell releases (stable and preview), builds a Termux
# .deb of each from the official linux-arm64 tarball, signs an apt repository,
# merges the website (docs/) into it and deploys the lot to GitHub Pages at
# https://pwsh-termux.machlev.org/. Each pwsh/pwsh-preview .deb, with the public key and the
# keyring package, is also kept as a release asset, on an annotated tag signed
# with the same online key (scripts/release-tags.sh).
#
# It runs, signs and deploys every day even when Microsoft has released
# nothing, and commits nothing: the signed index carries a Valid-Until 14 days
# ahead (scripts/build-repo.sh), and each daily run moves it on. An unchanged
# release rebuilds to the same bytes (build-deb.sh is reproducible), so
# Packages and every .deb stay byte-identical and only InRelease changes:
# clients re-download that small file and are offered no upgrade. If this
# workflow stops for more than 14 days, apt on every device refuses the
# expired index (staleness.yaml opens an issue 7 days before that). Its
# keepalive job renews every scheduled workflow, so GitHub's 60-day
# inactivity rule does not stop it (scripts/keep-schedules-alive.sh).
#
# One-time setup (secret, Pages source, custom domain): docs/markDown/engineering/release/setup.md
on:
  schedule:
    - cron: "23 4 * * *"      # daily, release or not: re-signs the index (Valid-Until)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "keys/**"
      - "packaging-revisions"
      - "docs/**"
      - ".github/workflows/update.yaml"
      - ".github/workflows/build-packages.yaml"

# Deploys never overlap and are never cancelled half way.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

# Every run: step runs as `bash --noprofile --norc -eo pipefail {0}`: a
# failure anywhere in a pipeline fails the step.
defaults:
  run:
    shell: bash

jobs:
  # Builds the .deb files, writes their SBOMs and attests their provenance.
  # No apt signing key here (see build-packages.yaml).
  build:
    permissions:
      contents: read
      id-token: write          # the attest job signs provenance with this identity
      attestations: write      # and records it on GitHub
    uses: $/.github/workflows/build-packages.yaml

  # Checks the keyring package's build provenance: built by build-packages.yaml,
  # from this commit, on a GitHub-hosted runner. A read-only token and no
  # signing key; publish signs only the file with the digest it outputs.
  verify:
    name: Verify the keyring package provenance
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read       # read the keyring package's provenance attestation
    outputs:
      keyring-sha256: ${{ steps.verify.outputs.sha256 }}
      deb-sha256s: ${{ steps.verify.outputs.sha256s }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      - name: Verify the provenance of every package
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keyring=(packages/pwsh-termux-keyring_*_all.deb)
          [ "${#keyring[@]}" -eq 1 ] && [ -f "${keyring[0]}" ]
          # Every .deb, so the signing job signs an index of nothing else.
          all=(packages/*.deb)
          [ -f "${all[0]}" ]
          sums=
          keyring_sum=
          for deb in "${all[@]}"; do
            sum=$(bash scripts/verify-attestation.sh "$deb" "$GITHUB_SHA")
            sums+=$sum$'\n'
            if [ "$deb" = "${keyring[0]}" ]; then keyring_sum=$sum; fi
          done
          [ -n "$keyring_sum" ]
          echo "sha256=$keyring_sum" >> "$GITHUB_OUTPUT"
          {
            echo "sha256s<<EOF_SHA256S"
            printf '%s' "$sums"
            echo "EOF_SHA256S"
          } >> "$GITHUB_OUTPUT"

  # Builds the unsigned apt index (Release and Packages) and the payloads of
  # the release tags the signing job will sign. No signing key and no token
  # that can write; the small files it hands on are a job output, so the
  # signing job needs no artifact storage and never sees a .deb.
  assemble:
    name: Build the unsigned repository
    needs: verify                # which itself needs build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      bundle: ${{ steps.bundle.outputs.bundle }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0       # assemble-site.sh reads each document's last commit (git log); every tag, for release-tags.sh

      - name: Download the packages and provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Build the unsigned apt repository
        run: |
          unset SIGN_KEY KEYRING_FILE GPG_PASSPHRASE_FILE
          bash scripts/build-repo.sh artifacts/packages repo

      - name: Write the release tag payloads and bundle what is to be signed
        id: bundle
        run: |
          unset SIGN_KEY KEYRING_FILE
          mkdir bundle
          bash scripts/release-tags.sh payloads artifacts/packages "$GITHUB_SHA" bundle/tags
          cp repo/dists/stable/Release repo/dists/stable/main/binary-aarch64/Packages bundle/
          bundle=$(bash scripts/signing-bundle.sh pack bundle)
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

  # The only job with the apt signing key. It never sees a .deb and has no
  # artifact access: it gets Release, Packages and the tag payloads as a job
  # output, checks them (sign-release.sh, release-tags.sh sign-payloads) and
  # returns the signatures the same way. GPG_PRIVATE_KEY and GPG_PASSPHRASE
  # are secrets of this environment (deployment branches: main only), not of
  # the repository, so no workflow on another branch can read them
  # (docs/markDown/engineering/release/setup.md, "The signing environment").
  # A repository secret of the same name must never come back: a job reads it
  # when its environment has no secret of that name. Its runner may reach
  # github.com (the checkout) and GitHub's Actions service, nothing else.
  sign:
    name: Sign the index and the release tags
    needs: [verify, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: signing
    permissions:
      contents: read
    outputs:
      bundle: ${{ steps.sign.outputs.bundle }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          # The key is in this job: nothing may leave the runner except to
          # GitHub (the checkout, and the Actions service for logs and outputs).
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            *.actions.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The key is imported and used in this one step: it never reaches
      # GITHUB_ENV or a later step. sign-release.sh refuses to sign unless the
      # key is the one key in keys/ (and not the recovery key), the index is
      # fresh, Release lists the Packages file it was given, and that file
      # holds the keyring package the verify job checked (KEYRING_DEB_SHA256);
      # it checks the signed index with gpgv against keys/. The same key then
      # signs the payload of each tag release-tags.sh made.
      #
      # The key is passphrase-protected; its passphrase is the second secret
      # of the environment, GPG_PASSPHRASE. It is written (by printf, a shell
      # builtin, so never in a process's argv) to a mode-600 file in a mode-700
      # folder under RUNNER_TEMP, handed on as GPG_PASSPHRASE_FILE (gpg
      # --pinentry-mode loopback --passphrase-file), and removed when the step
      # ends (trap) and again by the cleanup step below. Both secrets are
      # unset before any script runs. Without GPG_PASSPHRASE, an unprotected
      # key still signs, with a warning; a protected key then fails to sign,
      # and so does the step.
      - name: Sign the index and the tag payloads
        id: sign
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          KEYRING_DEB_SHA256: ${{ needs.verify.outputs.keyring-sha256 }}
          VERIFIED_DEB_SHA256S: ${{ needs.verify.outputs.deb-sha256s }}
          BUNDLE: ${{ needs.assemble.outputs.bundle }}
        run: |
          unset KEYRING_FILE GPG_PASSPHRASE_FILE
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY secret is not set; refusing to publish an unsigned repository"
            exit 1
          fi
          pass_dir="$RUNNER_TEMP/gpg-passphrase"
          trap 'rm -rf "$pass_dir"' EXIT
          if [ -n "$GPG_PASSPHRASE" ]; then
            (umask 077 && mkdir "$pass_dir" && printf '%s\n' "$GPG_PASSPHRASE" > "$pass_dir/passphrase")
            export GPG_PASSPHRASE_FILE="$pass_dir/passphrase"
          else
            echo "::warning::GPG_PASSPHRASE secret is not set: signing as if the online key has no passphrase (a protected key will fail to sign)"
          fi
          unset GPG_PASSPHRASE
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          unset GPG_PRIVATE_KEY
          SIGN_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ && !found {print $10; found = 1}')
          export SIGN_KEY
          mkdir "$RUNNER_TEMP/in"
          printf '%s' "$BUNDLE" | bash scripts/signing-bundle.sh unpack "$RUNNER_TEMP/in"
          if ! bash scripts/sign-release.sh sign "$RUNNER_TEMP/in" "$RUNNER_TEMP/out"; then
            echo "::error::signing the index failed (see sign-release.sh's error above); nothing is published"
            exit 1
          fi
          if ! bash scripts/release-tags.sh sign-payloads "$RUNNER_TEMP/in/tags" "$GITHUB_SHA" "$RUNNER_TEMP/out/tags" "$RUNNER_TEMP/in/Packages"; then
            echo "::error::signing the release tags failed (see release-tags.sh's error above); nothing is published"
            exit 1
          fi
          bundle=$(bash scripts/signing-bundle.sh pack "$RUNNER_TEMP/out")
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      # Even if the step above was killed before its trap ran: no passphrase
      # file is left, and gpg-agent forgets the cached passphrase.
      - name: Remove the passphrase file
        if: ${{ always() }}
        run: |
          rm -rf "$RUNNER_TEMP/gpg-passphrase"
          gpgconf --kill gpg-agent || true

  # Has no signing key: it rebuilds the unsigned repository from the same
  # packages (the same .deb files give byte-identical index files), installs
  # the signed Release, InRelease and Release.gpg only if every index file is
  # the one Release lists and both signatures verify against keys/, makes the
  # signed tags and the releases, and uploads the site. Its token can write
  # releases and tags, so its runner too may reach only GitHub.
  publish:
    name: Publish the signed repository
    needs: [verify, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write          # push the signed tags of new .deb files and create their releases
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          # Artifacts and logs live in Azure storage accounts GitHub names itself.
          # Two steps need them: download-artifact (the .debs) and
          # upload-pages-artifact (the site). harden-runner's policy is per
          # job, not per step, and the .debs reach any job only as an artifact,
          # so this job needs the wildcard; deploy-pages (below) is its own job.
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0       # assemble-site.sh reads each document's last commit (git log); every tag, for release-tags.sh

      - name: Download the packages and provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Check the website
        run: python3 .github/scripts/site-check.py docs

      - name: Install the signed index and make the signed tags
        env:
          KEYRING_DEB_SHA256: ${{ needs.verify.outputs.keyring-sha256 }}
          VERIFIED_DEB_SHA256S: ${{ needs.verify.outputs.deb-sha256s }}
          BUNDLE: ${{ needs.sign.outputs.bundle }}
        run: |
          unset SIGN_KEY KEYRING_FILE GPG_PASSPHRASE_FILE
          bash scripts/build-repo.sh artifacts/packages repo
          mkdir signed
          printf '%s' "$BUNDLE" | bash scripts/signing-bundle.sh unpack signed
          bash scripts/sign-release.sh install signed repo
          bash scripts/release-tags.sh assemble signed/tags
          bash scripts/assemble-site.sh docs repo
          python3 .github/scripts/site-check.py repo

      - name: Check SHA256SUMS against the verified digests
        env:
          VERIFIED_DEB_SHA256S: ${{ needs.verify.outputs.deb-sha256s }}
        run: |
          # SHA256SUMS goes into every release. It must list the .deb files
          # whose provenance the verify job checked, no other, and every file
          # it lists must be as it says, so an artifact replaced after that
          # job cannot ride along with a release.
          listed=$(awk '$2 ~ /\.deb$/ {print $1}' artifacts/packages/SHA256SUMS | LC_ALL=C sort)
          verified=$(LC_ALL=C sort <<<"$VERIFIED_DEB_SHA256S")
          [ "$listed" = "$verified" ]
          (cd artifacts/packages && sha256sum --check --strict SHA256SUMS)

      - name: Archive each .deb, its SBOMs, provenance and the public key as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The public key and the keyring package are attached to every
          # release as a second channel next to the website. A release keeps
          # the key that was current when it was made; a rotation does not
          # rewrite old releases. A release is created once, with all its files,
          # and never changed afterwards (so immutable releases can be on).
          #
          # Each release sits on the signed tag made above: release-tags.sh
          # push verifies it again and pushes it with this job's token (git
          # gets it from gh, never from an argument), and gh release create
          # --verify-tag uses that tag and never makes a lightweight one. The
          # push is deferred (exit 3) when main's .github/workflows changed
          # during the run, as GitHub refuses such a tag from a GITHUB_TOKEN:
          # that release then comes with the next run, on its own commit.
          mkdir keyfiles
          cp repo/pwsh-termux.gpg repo/pwsh-termux.asc repo/pwsh-termux-keyring.deb \
            artifacts/packages/pwsh-termux-keyring_*.json keyfiles/
          gpg --show-keys --with-colons keyfiles/pwsh-termux.gpg \
            | awk -F: '$1 == "pub" {want = 1; next} $1 == "fpr" && want {print $10; want = 0}' > keyfiles/FINGERPRINT.txt
          for deb in artifacts/packages/*.deb; do
            base=${deb%.deb}
            name=$(dpkg-deb -f "$deb" Package)
            ver=$(dpkg-deb -f "$deb" Version)
            # The keyring package is not a PowerShell release; it rides along.
            [ "$name" = pwsh-termux-keyring ] && continue
            tag=$(bash scripts/release-tags.sh name "$deb")
            gh release view "$tag" >/dev/null 2>&1 && continue
            rc=0
            bash scripts/release-tags.sh push "$tag" origin || rc=$?
            if [ "$rc" -eq 3 ]; then
              echo "::warning::$tag not pushed: main's workflows changed during this run; the next run releases it"
              continue
            elif [ "$rc" -ne 0 ]; then
              echo "::error::pushing the signed tag $tag failed (see release-tags.sh's error above)"
              exit 1
            fi
            files=("$deb" "$base".*.json artifacts/packages/SHA256SUMS artifacts/provenance/*.intoto.jsonl keyfiles/*)
            flags=(--verify-tag)
            [ "$name" = pwsh-preview ] && flags+=(--prerelease)
            # What changed in a release is what changed upstream: the package
            # is PowerShell's own build plus this repository's revision suffix.
            upstream="${ver%-*}"
            upstream_tag="v${upstream//\~/-}"
            gh release create "$tag" "${files[@]}" "${flags[@]}" \
              --title "$name $ver" \
              --notes "Unofficial Termux repackaging of Microsoft PowerShell ${upstream} (package revision ${ver##*-}). What changed in PowerShell itself: https://github.com/PowerShell/PowerShell/releases/tag/${upstream_tag}. Install from the apt repository: https://pwsh-termux.machlev.org/install.html. Attached: the .deb, its SBOMs (CycloneDX and three SPDX files), SHA256SUMS, the build provenance (verify with gh attestation verify, see SECURITY.md), the signing key (fingerprints in FINGERPRINT.txt and SECURITY.md) and pwsh-termux-keyring.deb (with its SBOMs), the package the install line downloads."
          done

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: repo
          include-hidden-files: true   # .well-known/security.txt (.git and .github stay excluded)

  deploy:
    name: Deploy to GitHub Pages
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write             # deploy the signed repository to GitHub Pages
      id-token: write          # deploy-pages proves the run's identity with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          # The audit log of a successful run showed only api.github.com and
          # the *.actions.githubusercontent.com run services. No artifact
          # download here (deploy-pages passes the artifact id to GitHub), so
          # no Azure wildcard.
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            *.actions.githubusercontent.com:443

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Renews every scheduled workflow, this one included, so GitHub does not
  # disable them after 60 days without repository activity
  # (scripts/keep-schedules-alive.sh; staleness.yaml and keepalive.yaml do
  # the same). Independent of the other jobs: it runs even when a build
  # fails. Its own token, with actions: write and no signing key.
  keepalive:
    name: Renew the scheduled workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write           # PUT .../actions/workflows/<file>/enable
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.actions.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Renew the scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/keep-schedules-alive.sh refresh
