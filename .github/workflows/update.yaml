name: Update packages

# Follows Microsoft's PowerShell releases (stable and preview), builds a Termux
# .deb of each from the official linux-arm64 tarball, signs an apt repository,
# merges the website (docs/) into it and deploys the lot to GitHub Pages at
# https://pwsh-termux.machlev.org/. Each pwsh/pwsh-preview .deb, with the public key and the
# keyring package, is also kept as a release asset.
#
# It runs, signs and deploys every day even when Microsoft has released
# nothing, and commits nothing: the signed index carries a Valid-Until 14 days
# ahead (scripts/build-repo.sh), and each daily run moves it on. An unchanged
# release rebuilds to the same bytes (build-deb.sh is reproducible), so
# Packages and every .deb stay byte-identical and only InRelease changes:
# clients re-download that small file and are offered no upgrade. If this
# workflow stops for more than 14 days, apt on every device refuses the
# expired index (staleness.yaml opens an issue 7 days before that). Its
# keepalive job renews every scheduled workflow, so GitHub's 60-day
# inactivity rule does not stop it (scripts/keep-schedules-alive.sh).
#
# One-time setup (secret, Pages source, custom domain): docs/markDown/engineering/release.md
on:
  schedule:
    - cron: "23 4 * * *"      # daily, release or not: re-signs the index (Valid-Until)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "keys/**"
      - "docs/**"
      - ".github/workflows/update.yaml"
      - ".github/workflows/build-packages.yaml"

# Deploys never overlap and are never cancelled half way.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Builds the .deb files, writes their SBOMs and attests their provenance.
  # No apt signing key here (see build-packages.yaml).
  build:
    permissions:
      contents: read
      id-token: write          # the attest job signs provenance with this identity
      attestations: write      # and records it on GitHub
    uses: ./.github/workflows/build-packages.yaml

  # Checks the keyring package's build provenance: built by build-packages.yaml,
  # from this commit, on a GitHub-hosted runner. A read-only token and no
  # signing key; publish signs only the file with the digest it outputs.
  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    outputs:
      keyring-sha256: ${{ steps.verify.outputs.sha256 }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      - name: Verify the keyring package's provenance
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          debs=(packages/pwsh-termux-keyring_*_all.deb)
          [ "${#debs[@]}" -eq 1 ] && [ -f "${debs[0]}" ]
          sha=$(bash scripts/verify-attestation.sh "${debs[0]}" "$GITHUB_SHA")
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

  # The only job with the apt signing key and a token that can write releases.
  publish:
    needs: [build, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # GPG_PRIVATE_KEY and GPG_PASSPHRASE are secrets of this environment
    # (deployment branches: main only), not of the repository, so no workflow
    # on another branch can read them (docs/markDown/engineering/release.md,
    # "One-time setup"). A repository secret of the same name must never come
    # back: a job reads it when its environment has no secret of that name.
    environment: signing
    permissions:
      contents: write          # create the archive releases for new .deb files
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0       # assemble-site.sh reads each document's last commit (git log)

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gnupg xz-utils

      - name: Check the website
        run: python3 .github/scripts/site-check.py docs

      - name: Download the packages and provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      # The key is imported and used in this one step: it never reaches
      # GITHUB_ENV or a later step. build-repo.sh refuses to sign unless the
      # key is the one key in keys/, the keyring package is the file the
      # verify job checked (KEYRING_DEB_SHA256) and ships keys/ byte for byte,
      # and the signed index verifies against keys/. KEYRING_FILE (tests only)
      # is cleared so keys/ is always what is checked and published.
      #
      # The key is passphrase-protected; its passphrase is the second secret
      # of the environment, GPG_PASSPHRASE. It is written (by printf, a shell
      # builtin, so never in a process's argv) to a mode-600 file in a mode-700
      # folder under RUNNER_TEMP, handed to build-repo.sh as
      # GPG_PASSPHRASE_FILE (gpg --pinentry-mode loopback --passphrase-file),
      # and removed when the step ends (trap) and again by the cleanup step
      # below. Both secrets are unset before build-repo.sh runs. Without
      # GPG_PASSPHRASE, an unprotected key still signs, with a warning; a
      # protected key then fails to sign, and so does the step.
      - name: Build the signed apt repository and assemble the site
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          KEYRING_DEB_SHA256: ${{ needs.verify.outputs.keyring-sha256 }}
        run: |
          unset KEYRING_FILE GPG_PASSPHRASE_FILE
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY secret is not set; refusing to publish an unsigned repository"
            exit 1
          fi
          pass_dir="$RUNNER_TEMP/gpg-passphrase"
          trap 'rm -rf "$pass_dir"' EXIT
          if [ -n "$GPG_PASSPHRASE" ]; then
            (umask 077 && mkdir "$pass_dir" && printf '%s\n' "$GPG_PASSPHRASE" > "$pass_dir/passphrase")
            export GPG_PASSPHRASE_FILE="$pass_dir/passphrase"
          else
            echo "::warning::GPG_PASSPHRASE secret is not set: signing as if the online key has no passphrase (a protected key will fail to sign)"
          fi
          unset GPG_PASSPHRASE
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          unset GPG_PRIVATE_KEY
          SIGN_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          export SIGN_KEY
          if ! bash scripts/build-repo.sh artifacts/packages repo; then
            echo "::error::building or signing the repository failed (see build-repo.sh's error above); nothing is published"
            exit 1
          fi
          bash scripts/assemble-site.sh docs repo
          python3 .github/scripts/site-check.py repo

      # Even if the step above was killed before its trap ran: no passphrase
      # file is left, and gpg-agent forgets the cached passphrase.
      - name: Remove the passphrase file
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/gpg-passphrase"
          gpgconf --kill gpg-agent || true

      - name: Archive each .deb, its SBOMs, provenance and the public key as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The public key and the keyring package are attached to every
          # release as a second channel next to the website. A release keeps
          # the key that was current when it was made; a rotation does not
          # rewrite old releases. A release is created once, with all its files,
          # and never changed afterwards (so immutable releases can be on).
          mkdir keyfiles
          cp repo/pwsh-termux.gpg repo/pwsh-termux.asc repo/pwsh-termux-keyring.deb \
            artifacts/packages/pwsh-termux-keyring_*.json keyfiles/
          gpg --show-keys --with-colons keyfiles/pwsh-termux.gpg \
            | awk -F: '$1 == "pub" {want = 1; next} $1 == "fpr" && want {print $10; want = 0}' > keyfiles/FINGERPRINT.txt
          for deb in artifacts/packages/*.deb; do
            base=${deb%.deb}
            name=$(dpkg-deb -f "$deb" Package)
            ver=$(dpkg-deb -f "$deb" Version)
            # The keyring package is not a PowerShell release; it rides along.
            [ "$name" = pwsh-termux-keyring ] && continue
            tag="${name}-${ver//\~/-}"          # git tags cannot contain '~'
            gh release view "$tag" >/dev/null 2>&1 && continue
            files=("$deb" "$base".*.json artifacts/packages/SHA256SUMS artifacts/provenance/*.intoto.jsonl keyfiles/*)
            flags=()
            [ "$name" = pwsh-preview ] && flags+=(--prerelease)
            gh release create "$tag" "${files[@]}" "${flags[@]}" \
              --title "$name $ver" \
              --notes "Unofficial Termux repackaging of Microsoft PowerShell. Install from the apt repository: https://pwsh-termux.machlev.org/install.html. Attached: the .deb, its SBOMs (CycloneDX and three SPDX files), SHA256SUMS, the build provenance (verify with gh attestation verify, see SECURITY.md), the signing key (fingerprints in FINGERPRINT.txt and SECURITY.md) and pwsh-termux-keyring.deb (with its SBOMs), the package the install line downloads."
          done

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: repo
          include-hidden-files: true   # .well-known/security.txt (.git and .github stay excluded)

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Renews every scheduled workflow, this one included, so GitHub does not
  # disable them after 60 days without repository activity
  # (scripts/keep-schedules-alive.sh; staleness.yaml and keepalive.yaml do
  # the same). Independent of the other jobs: it runs even when a build
  # fails. Its own token, with actions: write and no signing key.
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write           # PUT .../actions/workflows/<file>/enable
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Renew the scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/keep-schedules-alive.sh refresh
