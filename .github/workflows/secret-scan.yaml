name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

# A newer push to the same PR or branch supersedes a run still going;
# the long-lived branches' runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/main"]'), github.ref) }}

permissions:
  contents: read

env:
  # Release binaries, not source builds: each tarball is checked against the
  # SHA-256 pinned here before it is unpacked, so a moved tag or a replaced
  # asset fails the job. Bump a version with its release's digest
  # (`gh release view <tag> --json assets`). Betterleaks is a release
  # candidate on purpose: it is the maintained successor of Gitleaks, and
  # 2.0 is not final yet.
  BETTERLEAKS_VERSION: 2.0.0-rc.9
  BETTERLEAKS_SHA256: 772a1a2e2d13a5bd80ef4bc900ad90942ac4383ac79fb6cdfcc7df542434f2f8
  TRUFFLEHOG_VERSION: 3.100.0
  TRUFFLEHOG_SHA256: b2d85eba59865e98f45c9fc9f77d2c6d62df529fdd5755af121304ea5a7cecbb

# Every run: step runs as `bash --noprofile --norc -eo pipefail {0}`: a
# failure anywhere in a pipeline fails the step.
defaults:
  run:
    shell: bash

jobs:
  betterleaks:
    name: Betterleaks (whole history)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.actions.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install betterleaks
        run: |
          tgz="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          for attempt in 1 2 3 4 5; do
            gh release download "v$BETTERLEAKS_VERSION" -R betterleaks/betterleaks -p "$tgz" --clobber && break
            [ "$attempt" = 5 ] && exit 1
            echo "download failed (attempt $attempt)"; sleep $((attempt * 10))
          done
          echo "$BETTERLEAKS_SHA256  $tgz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/bin"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/bin" betterleaks
        env:
          GH_TOKEN: ${{ github.token }}

      # The whole history, every run: it is quick, and a leak in an old
      # commit counts as much as one in a new one. Matches are redacted so
      # a real secret never reaches the log. No validation (`-v`): it would
      # send the found secret to the service that issued it.
      - name: Scan the repository
        run: '"$RUNNER_TEMP/bin/betterleaks" git --no-banner --no-color --redact .'

  trufflehog:
    name: TruffleHog (whole history)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.actions.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install trufflehog
        run: |
          tgz="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          for attempt in 1 2 3 4 5; do
            gh release download "v$TRUFFLEHOG_VERSION" -R trufflesecurity/trufflehog -p "$tgz" --clobber && break
            [ "$attempt" = 5 ] && exit 1
            echo "download failed (attempt $attempt)"; sleep $((attempt * 10))
          done
          echo "$TRUFFLEHOG_SHA256  $tgz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/bin"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/bin" trufflehog
        env:
          GH_TOKEN: ${{ github.token }}

      # No verification: it would send each found secret to the service that
      # issued it, and the job may reach only GitHub. Every candidate counts
      # (`--results` lists them all), `--fail` turns one into a red job, and
      # `jq` drops the raw secret from the JSON before it reaches the log.
      - name: Scan the repository
        run: >-
          "$RUNNER_TEMP/bin/trufflehog" git file://. --no-update --no-color
          --no-verification --results=verified,unknown,unverified --fail --json
          | jq -c 'del(.Raw, .RawV2, .Redacted)'
